events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── UTF-8 encoding ───────────────────────────────────────────────────────
    # Tüm metin tabanlı dosyalar (JS dahil) UTF-8 olarak serve edilir.
    # Bu, Türkçe karakterlerin ve emojilerin tarayıcıda bozulmamasını sağlar.
    charset utf-8;
    charset_types text/html text/plain text/css application/javascript
                  text/javascript application/json text/xml;

    upstream game_backend {
        server go-1:8080;
        server go-2:8080;
        server go-3:8080;
    }

    # SSE connections need sticky sessions (same player → same instance)
    upstream game_sse {
        ip_hash;
        server go-1:8080;
        server go-2:8080;
        server go-3:8080;
    }

    server {
        listen 80;
        server_name _;

        # Static UI
        root /usr/share/nginx/html;
        index index.html;

        # SSE endpoint — sticky routing
        location /events {
            proxy_pass http://game_sse;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # API endpoints — load balanced
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://game_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /order {
            proxy_pass http://game_backend;
            proxy_set_header Host $host;
        }

        # Reset endpoint — her zaman primary instance'a gider
        location = /game/reset {
            proxy_pass http://go-1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /game/ {
            proxy_pass http://game_backend;
            proxy_set_header Host $host;
        }

        location /orders/ {
            proxy_pass http://game_backend;
            proxy_set_header Host $host;
        }

        location /analysis/ {
            proxy_pass http://game_backend;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://game_backend;
        }

        # Serve UI for all other paths
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
